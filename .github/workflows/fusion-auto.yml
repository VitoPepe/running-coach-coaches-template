# Fusion automatique : tout ce que Claude pousse sur une branche `claude/…` arrive sur `main`, sans rien faire.
# Les sessions et les tâches planifiées de Claude ne peuvent parfois pousser que sur une branche `claude/…`.
# Ce robot la fusionne dans `main` dans la minute, puis supprime la branche. Rien à configurer.
# En cas de conflit, il ne force rien et n'alerte personne : il laisse la branche, et le radar du matin la rattrape
# (automations/radar-matin.md, étape 8).
name: Fusion automatique sur main

on:
  push:
    branches: ["claude/**"]
  schedule:
    - cron: "37 5 * * *" # rattrapage chaque jour à 05:37 UTC, avant le radar du matin
  workflow_dispatch: # bouton « Run workflow » dans l'onglet Actions

permissions:
  contents: write
  actions: write

concurrency:
  group: fusion-main
  cancel-in-progress: false

jobs:
  fusion:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fusionner les branches claude/… dans main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch --prune origin "+refs/heads/*:refs/remotes/origin/*"
          branches=$(git for-each-ref --format='%(refname:strip=3)' 'refs/remotes/origin/claude/' | sort)
          if [ -z "$branches" ]; then
            echo "Aucune branche claude/… à fusionner." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          sync_drive=0
          for b in $branches; do
            fusionnee=0
            for essai in 1 2 3; do
              git fetch origin "+refs/heads/main:refs/remotes/origin/main" "+refs/heads/$b:refs/remotes/origin/$b"
              git checkout -q -B main origin/main
              if git merge-base --is-ancestor "origin/$b" main; then
                fusionnee=1; break  # déjà dans main
              fi
              avant=$(git rev-parse HEAD)
              if ! git merge --no-edit -m "fusion: $b" "origin/$b"; then
                git merge --abort || true
                fusionnee=-1; break  # vrai conflit : on ne force rien
              fi
              if git diff --name-only "$avant" HEAD | grep -qE '^(drive-sources/sources\.json|scripts/sync_.*\.py)$'; then
                sync_drive=1
              fi
              if git push origin main; then
                fusionnee=1; break
              fi
              echo "main a bougé pendant la fusion, nouvel essai ($essai/3)…"
              sleep $((essai * 5))
            done

            if [ "$fusionnee" = 1 ]; then
              git push origin --delete "$b" || true
              echo "✅ \`$b\` fusionnée dans main" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "⚠️ \`$b\` n'a pas pu être fusionnée (conflit)" >> "$GITHUB_STEP_SUMMARY"
              echo "La branche reste en place : le radar du matin s'en occupera." >> "$GITHUB_STEP_SUMMARY"
            fi
          done

          # Les pushs faits par ce robot ne relancent pas les autres workflows : on relance la synchro Drive si besoin.
          if [ "$sync_drive" = 1 ]; then
            gh workflow run sync-drive.yml --ref main || true
          fi

