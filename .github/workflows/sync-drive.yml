name: Sync Google Drive

on:
  schedule:
    - cron: "0 3 * * *" # tous les jours, 03:00 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - drive-sources/sources.json
      - scripts/sync_*.py

permissions:
  contents: write

concurrency:
  group: sync-drive
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Drive -> drive-sources/
        env:
          DRIVE_SECRETS: ${{ toJSON(secrets) }}
          DRIVE_VARS: ${{ toJSON(vars) }}
        run: python3 scripts/sync_drive.py

      - name: Commit si changement
        if: ${{ !cancelled() }} # garde les sources réussies même si une autre a échoué
        run: |
          git add -A drive-sources
          if git diff --cached --quiet; then
            echo "Aucun changement."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "sync: Google Drive -> drive-sources"
          git push
